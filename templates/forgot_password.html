{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto;">
  <h2>Mot de passe oublié</h2>
  {% if reset_url %}
  <div style="background:#d4edda;border:1px solid #28a745;padding:1rem;border-radius:6px;margin-bottom:1rem;line-height:1.6">
    <strong>Lien de réinitialisation généré :</strong><br>
    <a href="{{ reset_url }}" style="word-break:break-all">{{ reset_url }}</a><br>
    <small class="muted">Ce lien expire dans 1 heure et ne peut être utilisé qu'une seule fois.</small>
  </div>
  {% elif info %}
  <div class="muted" style="margin-bottom:1rem">{{ info }}</div>
  {% endif %}
  <form method="post">
    <p><label>Votre adresse email</label>
    <input type="email" name="email" required autofocus style="width:100%"></p>
    <button class="btn" type="submit" style="width:100%">Générer un lien de réinitialisation</button>
  </form>
  <p style="text-align:center;margin-top:1.2rem"><a href="/login">← Retour à la connexion</a></p>
</div>
{% endblock %}
